<title>The Squishy Comeback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap">
<style>
  /* One deliberate look, the film's own paper and pinks, painted explicitly so it reads the same on any host theme. */
  :root {
    --paper: #F7EFE4;
    --ink: #2B2130;
    --soft: #7A6275;
    --berry: #D94C7C;
    --cream: #FFF8EE;
    --blush: #F6C9D8;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding-inline: 16px;
    background:
      radial-gradient(900px 500px at 50% -10%, var(--blush), transparent 70%),
      var(--paper);
    color: var(--ink);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding-block: 44px 64px;
    display: grid;
    gap: 18px;
    justify-items: center;
    text-align: center;
  }
  .eyebrow {
    margin: 0;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--berry);
  }
  h1 {
    margin: 0;
    max-width: 18ch;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 600;
    font-size: clamp(30px, 6vw, 54px);
    line-height: 1.06;
    text-wrap: balance;
  }
  .frame {
    width: 100%;
    margin-top: 10px;
    padding: 12px 12px 14px;
    box-sizing: border-box;
    background: var(--cream);
    border-radius: 22px;
    box-shadow: 0 2px 0 rgba(43, 33, 48, .06), 0 22px 44px -22px rgba(140, 60, 90, .45);
    transform: rotate(-.4deg);
  }
  video {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    background: #EE8FB4;
  }
  video:focus-visible { outline: 3px solid var(--berry); outline-offset: 4px; }
  .note { margin: 6px 0 0; max-width: 46ch; font-size: 17px; line-height: 1.5; color: var(--soft); }
</style>

<main>
  <p class="eyebrow">A tiny film</p>
  <h1>Two squishies have something to tell you</h1>
  <div class="frame">
    <video src="squishy-comeback.mp4" poster="poster.jpg" controls playsinline preload="metadata" aria-label="The Squishy Comeback, a 45-second animated film"></video>
  </div>
  <p class="note">Turn the sound up and press play. It's about 45 seconds long.</p>
</main>
