<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squishy studio</title>
<style>
  html, body { margin: 0; background: #1d1a22; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F7EFE4; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 170px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="45.6" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- every frame is painted by these, in order -->
<script src="src/cues.js"></script>
<script src="src/engine.js"></script>
<script src="src/room.js"></script>
<script src="src/squishy.js"></script>
<script src="src/letters.js"></script>
<script src="src/scenes.js"></script>
<script>boot();</script>
</body>
</html>
